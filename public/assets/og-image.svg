<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none"
  xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0F17"/>

  <!-- Subtle decorative gradients/glows -->
  <circle cx="1050" cy="100" r="250" fill="#1E293B" opacity="0.3" filter="blur(60px)"/>
  <circle cx="150" cy="550" r="200" fill="#0284C7" opacity="0.15" filter="blur(60px)"/>

  <!-- Frame Border -->
  <rect x="30" y="30" width="1140" height="570" rx="16" stroke="#1E293B" stroke-width="2"/>

  <!-- Content Container -->
  <g transform="translate(90, 110)">
    <!-- Role Badge -->
    <rect x="0" y="0" width="310" height="42" rx="21" fill="#0284C7" fill-opacity="0.15"/>
    <rect x="0" y="0" width="310" height="42" rx="21" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5px">PRINCIPAL SOFTWARE ENGINEER</text>

    <!-- Name -->
    <text x="0" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1px">Zaid Aiman</text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500">Cloud Architect &amp; Backend Specialist</text>

    <!-- Description -->
    <text x="0" y="270" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Building secure, scalable platforms across government, enterprise,</tspan>
      <tspan x="0" dy="32">SaaS, and e-commerce domains.</tspan>
    </text>
  </g>
</svg>
